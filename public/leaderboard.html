<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Hunt - Bestenliste</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .lb-wrap { width: 100%; max-width: 900px; }
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: clamp(0.8rem, 2.4vw, 1.4rem); table-layout: fixed; }
  th, td { padding: 12px 8px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  thead th { color: var(--text-muted); font-weight: 600; border-bottom: 2px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:nth-child(1) .rank { color: var(--accent); font-weight: 800; }
  .rank { width: 10%; }
  .col-punkte { width: 27%; }
  .col-reaktion { width: 32%; }

  @media (min-width: 480px) {
    th, td { padding: 14px 18px; }
  }
  .empty { text-align: center; color: var(--text-muted); padding: 40px; }
  tbody#lb-body-extra tr .rank { color: inherit; font-weight: 400; }
  .toggle-more { align-self: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="app lb-wrap">
  <div class="brand-logo"><img src="/img/akb-logo.png" alt="Aargauische Kantonalbank"></div>
  <h1><span class="accent">Bug</span> Hunt - Bestenliste</h1>
  <p class="subtitle">Top 10 des heutigen Tages</p>
  <div class="panel">
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th class="rank">#</th><th>Name</th><th class="col-punkte">Punkte</th><th class="col-reaktion">Reaktion</th></tr>
        </thead>
        <tbody id="lb-body"></tbody>
        <tbody id="lb-body-extra" hidden></tbody>
      </table>
    </div>
    <p class="empty" id="lb-empty" hidden>Noch keine Partien gespielt.</p>
    <button id="btn-toggle-more" class="link toggle-more" hidden>Weitere anzeigen</button>
  </div>

  <div class="panel" style="align-items: center;">
    <p class="round-label" style="margin: 0; font-weight: 600;">Jetzt mitspielen!</p>
    <div class="qr-wrap">
      <img src="/qr-home.png" alt="QR-Code zum Mitspielen" width="180" height="180">
    </div>
    <p class="status-banner" style="margin: 0;">QR-Code scannen und direkt loslegen</p>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/leaderboard.js"></script>
</body>
</html>
